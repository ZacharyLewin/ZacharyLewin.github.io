<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photos — Zachary D. Lewin</title>
<style>
:root{--ink:#121212;--muted:#767676;--sans:"Helvetica Neue",Helvetica,Arial,sans-serif;--serif:Georgia,"Times New Roman",serif}
*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font-family:var(--serif)}
.back{position:fixed;top:12px;left:12px;z-index:50;font-family:var(--sans);font-size:12px;font-weight:800;letter-spacing:.06em;background:#111;color:#fff;text-decoration:none;padding:7px 10px;line-height:1}
.back span{font-weight:500;opacity:.75}
main{max-width:1120px;margin:0 auto;padding:70px 24px 60px}
h1{font-size:clamp(36px,5vw,52px);margin:0 0 6px;letter-spacing:-.01em}
.dek{font-family:var(--sans);font-size:15px;color:var(--muted);margin:0 0 30px}
.photos{columns:3 280px;column-gap:16px}.photos figure{break-inside:avoid;margin:0 0 18px}
.photos img,.photos video{width:100%;display:block;background:#222}.photos img{cursor:zoom-in}
.photos figure.tall img,.photos figure.tall video{aspect-ratio:3/4;object-fit:cover}
.photos figcaption{font-family:var(--sans);font-size:12px;color:var(--muted);margin-top:6px}
.lb{position:fixed;inset:0;background:rgba(10,10,10,.92);display:none;align-items:center;justify-content:center;z-index:100;cursor:zoom-out;padding:20px}
.lb.on{display:flex}.lb img{max-height:94vh;max-width:94vw}
</style></head><body>
<a class="back" href="../#about">ZDL <span>· About</span></a>
<main>
<h1>Photos</h1>
<p class="dek">Away from the desk: climbing, track, backgammon.</p>
<div class="photos">
    <figure class="tall"><video src="../assets/climb-boulder.mp4" poster="../assets/climb-boulder.jpg" muted loop playsinline preload="none" aria-label="Zachary bouldering in Montréal"></video><figcaption>Bouldering, Montréal</figcaption></figure>
    <figure><img src="../assets/backgammon-night.jpg" data-full="../assets/backgammon-night.jpg" alt="Zachary playing backgammon at a low table in a candlelit bar" loading="lazy"><figcaption>Backgammon</figcaption></figure>
    <figure><video src="../assets/hurdles.mp4" poster="../assets/hurdles.jpg" muted loop playsinline preload="none" aria-label="Zachary running hurdles"></video><figcaption>Hurdles</figcaption></figure>
    <figure><video src="../assets/polevault.mp4" poster="../assets/polevault.jpg" muted loop playsinline preload="none" aria-label="Pole vault at a school track meet"></video><figcaption>Pole vault</figcaption></figure>
    <figure><img src="../assets/lectern-sq.jpg" data-full="../assets/lectern-sq.jpg" alt="Zachary at the lectern of a McGill lecture hall" loading="lazy"><figcaption>McGill</figcaption></figure>
  </div>
</main>
<div class="lb" id="lb"><img alt=""></div>
<script>
const lb=document.getElementById('lb');
document.querySelectorAll('[data-full]').forEach(i=>i.addEventListener('click',()=>{lb.querySelector('img').src=i.dataset.full;lb.classList.add('on')}));
lb.addEventListener('click',()=>lb.classList.remove('on'));
const io=new IntersectionObserver(es=>es.forEach(e=>{const v=e.target;if(e.isIntersecting){v.preload='auto';v.play().catch(()=>{})}else v.pause()}),{threshold:.35});
document.querySelectorAll('video').forEach(v=>io.observe(v));
</script></body></html>
